<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa...</title>
    <style>
        body {
            background-color: rgb(49, 49, 226);
            color: white; /*Comentário em CSS */
            font: normal 20pt arial;
        }
    </style>
</head>
<body>
    <h1>olá, mundo!</h1> <!-- Isso é um comentário -->
    <p>Já me livrei da maldição.</p>
    <script>
        var nome = window.prompt('Qual é seu nome?') //Vai perguntar o nome.//
        window.alert('É um grande prazer em te conhecer, ' + nome)
        var n1 = Number.parseInt(window.prompt('Digite um número: '))
        var n2 = Number.parseInt(window.prompt('Digite outro número: '))
        var s = n1 + n2
        window.alert(`A soma entre ${n1} e ${n2} é igual a ${s}`) //template string//
        window.alert('A soma dos valores é ' + s) //concatenação
        // (number + number) para adição
        // (string + string) para concatenação
    </script>
</body>
</html>
